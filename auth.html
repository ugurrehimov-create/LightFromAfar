<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b081d">
  <title>Sign in · Light from Afar</title>
  <link rel="stylesheet" href="astralog.css">
  <link rel="stylesheet" href="auth.css">
  <script src="auth-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth-page.js" defer></script>
</head>
<body class="lfa-auth-page">
  <main class="lfa-auth-shell">
    <a class="lfa-auth-brand" href="index.html" aria-label="Light from Afar home">
      <span class="lfa-auth-brand-mark" aria-hidden="true">✦</span>
      <span><strong>Light from</strong> <b>Afar</b></span>
    </a>

    <section class="lfa-auth-card" aria-labelledby="auth-title">
      <a class="lfa-auth-back" href="index.html">← Back to the sky</a>
      <p class="lfa-auth-eyebrow">YOUR ASTROPHOTOGRAPHY WORKSPACE</p>
      <h1 id="auth-title">Welcome back</h1>
      <p class="lfa-auth-description" id="auth-description">Sign in to your Light from Afar account.</p>

      <div class="lfa-auth-tabs" id="auth-tabs" role="tablist" aria-label="Account access">
        <button class="lfa-auth-tab" id="signin-tab" type="button" role="tab" aria-selected="true">Sign in</button>
        <button class="lfa-auth-tab" id="signup-tab" type="button" role="tab" aria-selected="false">Create account</button>
      </div>

      <div class="lfa-auth-social" id="auth-social">
        <button class="lfa-auth-provider" id="google-signin" type="button">
          <span class="lfa-auth-google-mark" aria-hidden="true">G</span><span>Continue with Google</span>
        </button>
        <button class="lfa-auth-provider" id="apple-signin" type="button">
          <svg aria-hidden="true" viewBox="0 0 20 22"><path d="M16.7 11.7c0-2.1 1.7-3.2 1.8-3.3a4 4 0 0 0-3.2-1.7c-1.4-.2-2.7.9-3.4.9-.7 0-1.8-.9-3-.9A4.5 4.5 0 0 0 5 9.1c-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.7 2.5 2.9 2.4 1.2 0 1.6-.8 3-.8s1.8.8 3 .8 2.1-1.2 2.8-2.5a10 10 0 0 0 1.3-2.6 3.8 3.8 0 0 1-2.5-4.3ZM14.4 5.2A4 4 0 0 0 15.3 2a4.1 4.1 0 0 0-2.8 1.5 3.8 3.8 0 0 0-.9 3.1 3.4 3.4 0 0 0 2.8-1.4Z"/></svg>
          <span>Continue with Apple</span>
        </button>
      </div>

      <div class="lfa-auth-divider" id="auth-divider"><span>or continue with email</span></div>

      <form id="auth-form" novalidate>
        <div class="lfa-auth-field" id="name-field" hidden>
          <label for="auth-name">Your name</label>
          <input id="auth-name" name="name" type="text" maxlength="80" autocomplete="name" placeholder="How should we address you?">
        </div>
        <div class="lfa-auth-field" id="email-field">
          <label for="auth-email">Email address</label>
          <input id="auth-email" name="email" type="email" maxlength="254" autocomplete="email" placeholder="you@example.com" required>
        </div>
        <div class="lfa-auth-field" id="password-field">
          <div class="lfa-auth-label-row"><label for="auth-password">Password</label><button class="lfa-auth-text-button" id="forgot-password" type="button">Forgot password?</button></div>
          <input id="auth-password" name="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" placeholder="Your password" required>
        </div>
        <div class="lfa-auth-field" id="confirm-field" hidden>
          <label for="auth-confirm-password">Confirm password</label>
          <input id="auth-confirm-password" name="confirmPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Enter your password again">
        </div>
        <div class="lfa-auth-field" id="recovery-field" hidden>
          <label for="auth-new-password">New password</label>
          <input id="auth-new-password" name="newPassword" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="At least 8 characters">
          <label class="lfa-auth-confirm-label" for="auth-new-password-confirm">Confirm new password</label>
          <input id="auth-new-password-confirm" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="Enter it again">
        </div>
        <button class="lfa-auth-primary" id="auth-submit" type="submit">Sign in</button>
        <button class="lfa-auth-text-button lfa-auth-cancel" id="auth-cancel" type="button" hidden>Back to sign in</button>
      </form>

      <p class="lfa-auth-status" id="auth-status" role="status" aria-live="polite"></p>
      <p class="lfa-auth-config-note" id="auth-config-note" hidden></p>
      <p class="lfa-auth-footnote">Your profile is optional. You can explore the sky map without signing in.</p>
    </section>

    <p class="lfa-auth-footer">Explore the sky. Plan the session. Keep the record.</p>
  </main>
</body>
</html>
